name: docker

on:
  push:
    branches: [main]
    paths:
      - handler.py
      - Dockerfile
      - requirements.txt
      - .dockerignore

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/josue-gomes/pythonwan:latest
            ghcr.io/josue-gomes/pythonwan:v2
          cache-from: type=gha
          cache-to: type=gha,mode=max
